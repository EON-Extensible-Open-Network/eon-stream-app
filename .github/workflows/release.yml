name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish"
        required: true

permissions:
  contents: write

# Releases are built by CI, never on a developer machine. That is what madde 22
# asks for -- a pinned toolchain, a recorded build, and a published SHA256 that
# anyone can check -- and it is also the only honest way to say where a binary
# someone downloaded came from.
#
# Every desktop platform EON Stream runs on (madde 2, plan v0.14), each built
# and self-tested on a runner of its own architecture: a binary is never
# published from a machine that could not have run it.

jobs:
  build:
    name: build · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, runner: windows-latest, ext: ".exe" }
          - { name: windows-aarch64, runner: windows-11-arm, ext: ".exe" }
          # 22.04 rather than the newest: the binary links the system's glibc
          # and webkit2gtk, and building on the older one is what lets it run
          # on Ubuntu 22.04+, Debian 12+ and Fedora 36+.
          - { name: linux-x86_64, runner: ubuntu-22.04, ext: "" }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm, ext: "" }
          - { name: macos-aarch64, runner: macos-latest, ext: "" }
          - { name: macos-x86_64, runner: macos-15-intel, ext: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Rust (only where the image has none)
        shell: bash
        run: |
          if command -v rustup >/dev/null 2>&1; then exit 0; fi
          case "${{ matrix.name }}" in
            windows-aarch64)
              curl -sSfLo rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
              ./rustup-init.exe -y --default-toolchain none --profile minimal
              echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH" ;;
            *)
              curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH" ;;
          esac

      - name: The window's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev pkg-config build-essential

      - name: Show the pinned toolchain
        shell: bash
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        shell: bash
        run: cargo build --release --locked

      - name: The window's host must answer for itself before it ships
        shell: bash
        run: |
          # The same self-test CI runs, against the binary that is about to be
          # published rather than one built like it. A release that fails this
          # does not get uploaded. It opens no window, so it needs no display.
          target/release/eon-stream${{ matrix.ext }} --selftest selftest.txt
          cat selftest.txt
          grep -q '^ok$' selftest.txt

      - name: Stage the artefacts
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="${{ inputs.tag }}"; fi
          mkdir -p dist
          # Two binaries, one naming scheme. `eon-stream` is the product: the
          # window. `eon-stream-cli` is the headless build every part of it was
          # proven in, and it still ships because it can do things the window
          # cannot yet -- modules, subtitles by hand, the update check.
          cp "target/release/eon-stream${{ matrix.ext }}" "dist/eon-stream-${tag}-${{ matrix.name }}${{ matrix.ext }}"
          cp "target/release/eon-stream-cli${{ matrix.ext }}" "dist/eon-stream-cli-${tag}-${{ matrix.name }}${{ matrix.ext }}"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    name: checksums · publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: One checksum file for every platform
        run: |
          cd dist
          sha256sum eon-stream-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: true
          generate_release_notes: false
          body_path: .github/release-notes-alpha.md
