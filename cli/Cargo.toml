[package]
name = "eon-stream-cli"
version = "0.13.0-alpha"
description = "EON Stream alpha: run a Stremio-compatible addon and look at what it returns."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "eon-stream"
path = "src/main.rs"

[dependencies]
# Pinned to an exact commit, not a branch: an alpha binary someone downloads
# should be buildable from the same inputs tomorrow. Pin the commit whose CI
# went green, not merely the newest one -- v0.12 shipped against a core commit
# whose own workflow had failed to parse, which nobody would have noticed from
# here.
eon-stream-core = { git = "https://github.com/EON-Extensible-Open-Network/eon-stream-core", rev = "80d06f15f45c762d117b0ee5da6bf04de2f83cc7" }
eon-stream-engine = { git = "https://github.com/EON-Extensible-Open-Network/eon-stream-engine", rev = "30e699c95d3942aadab775b513f820597275d08f" }
ureq = "2"

[dev-dependencies]
# Tests build addon stream objects from the JSON an addon actually sends,
# rather than from hand-constructed structs that cannot drift from the wire
# format.
serde_json = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
