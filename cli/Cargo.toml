[package]
name = "eon-stream-cli"
version = "0.11.0-alpha"
description = "EON Stream alpha: run a Stremio-compatible addon and look at what it returns."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "eon-stream"
path = "src/main.rs"

[dependencies]
# Pinned to an exact commit, not a branch: an alpha binary someone downloads
# should be buildable from the same inputs tomorrow.
eon-stream-core = { git = "https://github.com/EON-Extensible-Open-Network/eon-stream-core", rev = "ea4ab32548c8bd92c62c65aae3615c5167a34879" }
eon-stream-engine = { git = "https://github.com/EON-Extensible-Open-Network/eon-stream-engine", rev = "90f07dc6bf4b7183a532543e64e5d8171c407028" }
ureq = "2"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
panic = "deny"
