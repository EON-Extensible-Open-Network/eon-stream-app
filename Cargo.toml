# Workspace. Two binaries over the same libraries: `src-tauri/` is the window
# (`eon-stream.exe`, the product) and `cli/` is the headless build that proved
# every part of it (`eon-stream-cli.exe`, still shipped). The interface was the
# last thing added, which is what madde 2 asked for.
#
# The version lives here rather than in either crate, because the two must
# never disagree: both print it at startup and both send it as their HTTP
# user-agent, so a mismatch would make one of them misreport itself. Tag `v0.X`
# maps to `0.X.0-alpha`.
[workspace]
members = ["cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.27.0-alpha"
edition = "2021"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/EON-Extensible-Open-Network/eon-stream-app"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
