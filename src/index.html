The catalogue. Static HTML, CSS and JavaScript -- no framework, no bundler, no
Node. Everything a person reads here is empty in this file and filled from the
message catalogue at startup (madde 40): a `data-say` attribute names a key,
`data-label` names one for an aria-label, and a label with text baked into it
would be a label nobody can translate.

Every path in this file is relative, and nothing here assumes where it is
served from. That is deliberate: see "The interface is relocatable" in
docs/architecture.md.

The player is not in this page. It is `player.html`, a second webview laid
over mpv's picture while something plays; see src-tauri/src/surface.rs.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EON Stream</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="nav" id="nav">
      <div class="nav-start">
        <button id="side-toggle" class="icon-button" type="button" data-icon="menu" data-label="ui.nav.menu" aria-controls="side" aria-expanded="true"></button>
        <button class="brand" type="button" data-go="home" data-label="ui.nav.home">
          <span class="mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="wordmark" aria-hidden="true">EON<b>Stream</b></span>
        </button>
      </div>
      <form id="search-form" class="searchbox" role="search">
        <input id="search-input" type="search" autocomplete="off" spellcheck="false" />
        <button type="submit" class="search-go" data-icon="search" data-label="ui.action.search"></button>
      </form>
      <div class="nav-tools">
        <button id="link-open" class="icon-button" type="button" data-icon="link" data-label="ui.action.openlink"></button>
        <span class="who-wrap">
          <button id="who-open" class="who-open" type="button" aria-haspopup="menu"></button>
        </span>
      </div>
    </header>

    <aside id="side" class="side" data-label="ui.nav.menu">
      <nav class="side-group" data-label="ui.nav.menu">
        <button class="link" type="button" data-go="home" data-icon="home" data-say="ui.nav.home"></button>
        <button class="link" type="button" data-go="series" data-icon="tv" data-say="ui.nav.series"></button>
        <button class="link" type="button" data-go="movie" data-icon="film" data-say="ui.nav.movies"></button>
        <button class="link" type="button" data-go="new" data-icon="flame" data-say="ui.nav.new"></button>
        <button class="link" type="button" data-go="discover" data-icon="compass" data-say="ui.nav.discover"></button>
        <button class="link" type="button" data-go="library" data-icon="bookmark" data-say="ui.nav.library"></button>
      </nav>
      <hr class="side-rule" />
      <nav class="side-group side-more" data-label="ui.nav.you">
        <h2 class="side-head" data-say="ui.nav.you"></h2>
        <button class="link" type="button" data-go="profile" data-icon="star" data-say="ui.nav.profile"></button>
        <button class="link" type="button" data-go="calendar" data-icon="calendar" data-say="ui.nav.calendar"><span id="calendar-dot" class="dot" hidden></span></button>
        <button class="link" type="button" data-go="downloads" data-icon="download" data-say="ui.nav.downloads"></button>
        <button class="link" type="button" data-go="community" data-icon="people" data-say="ui.nav.community"><span id="community-dot" class="dot" hidden></span></button>
      </nav>
      <hr class="side-rule" />
      <nav class="side-group side-more" data-label="ui.nav.app">
        <button class="link" type="button" data-go="addons" data-icon="addon" data-say="ui.nav.addons"></button>
        <button class="link" type="button" data-go="settings" data-icon="settings" data-say="ui.nav.settings"></button>
      </nav>
    </aside>

    <main id="main">
      <section class="view" id="view-home">
        <div id="hero" class="hero" hidden>
          <div class="hero-art" id="hero-art"></div>
          <div class="hero-shade"></div>
          <div class="hero-body">
            <h1 id="hero-title" class="hero-title"></h1>
            <div id="hero-facts" class="facts"></div>
            <p id="hero-text" class="hero-text"></p>
            <div class="hero-actions">
              <button id="hero-play" class="button play" type="button" data-icon="play" data-say="ui.hero.play"></button>
              <button id="hero-info" class="button ghost" type="button" data-icon="info" data-say="ui.hero.info"></button>
            </div>
          </div>
        </div>
        <div id="home-empty" class="empty" hidden>
          <span class="mark big" aria-hidden="true"><span></span><span></span><span></span></span>
          <h2 data-say="ui.empty.title"></h2>
          <p data-say="ui.empty.body"></p>
          <button id="empty-add" class="button play" type="button" data-icon="plus" data-say="ui.empty.action"></button>
        </div>
        <div id="rows" class="rows"></div>
      </section>

      <section class="view page" id="view-search" hidden>
        <h2 id="search-heading" class="page-title"></h2>
        <p id="search-correction" class="correction" hidden></p>
        <div id="search-grid" class="grid"></div>
        <nav id="search-pages" class="pager" hidden></nav>
      </section>

      <section class="view" id="view-new" hidden>
        <div class="new-page">
          <h2 class="page-title" data-say="ui.nav.new"></h2>
          <p id="new-empty" class="lede" data-say="ui.new.empty" hidden></p>
        </div>
        <div id="new-rows" class="rows"></div>
      </section>

      <!-- Discover: one catalogue at a time, as a grid, narrowed by type and
           genre, that keeps loading as it is scrolled. Every choice on it is a
           catalogue or a genre an addon declared. -->
      <section class="view page" id="view-discover" hidden>
        <h2 class="page-title" data-say="ui.nav.discover"></h2>
        <div class="discover-bar">
          <label class="pick"><span data-say="ui.discover.type"></span><select id="discover-type" class="sort-select"></select></label>
          <label class="pick"><span data-say="ui.discover.catalog"></span><select id="discover-catalog" class="sort-select"></select></label>
          <label class="pick"><span data-say="ui.discover.genre"></span><select id="discover-genre" class="sort-select"></select></label>
        </div>
        <p id="discover-empty" class="lede" hidden></p>
        <div id="discover-grid" class="grid"></div>
        <div id="discover-more" class="discover-more" aria-hidden="true"></div>
      </section>

      <!-- The episodes of the library's series around today: what aired
           lately, and what is coming. -->
      <section class="view page" id="view-calendar" hidden>
        <h2 class="page-title" data-say="ui.nav.calendar"></h2>
        <p id="calendar-note" class="lede" hidden></p>
        <div id="calendar-list" class="calendar"></div>
      </section>

      <!-- The viewer's own scores and reviews, kept on this machine. -->
      <section class="view page" id="view-profile" hidden>
        <h2 class="page-title" data-say="ui.nav.profile"></h2>
        <p class="lede" data-say="ui.profile.local"></p>
        <div id="profile-stats" class="profile-stats"></div>
        <div class="discover-bar">
          <label class="pick"><span data-say="ui.sources.sort"></span><select id="profile-order" class="sort-select"></select></label>
        </div>
        <div id="profile-grid" class="grid"></div>
      </section>

      <!-- The community: shared scores, reviews and friends, against a server
           the viewer chooses. Dormant until one is set (madde 7, 30). -->
      <section class="view page" id="view-community" hidden>
        <h2 class="page-title" data-say="ui.nav.community"></h2>
        <div id="community-body" class="community"></div>
      </section>

      <!-- Titles downloaded whole, to watch without a connection. -->
      <section class="view page" id="view-downloads" hidden>
        <h2 class="page-title" data-say="ui.nav.downloads"></h2>
        <p class="lede" data-say="ui.download.note"></p>
        <div id="download-list" class="calendar"></div>
      </section>

      <section class="view page" id="view-library" hidden>
        <h2 class="page-title" data-say="ui.nav.library"></h2>
        <div class="discover-bar">
          <div id="library-kinds" class="chips" role="group"></div>
          <label class="pick"><span data-say="ui.sources.sort"></span><select id="library-order" class="sort-select"></select></label>
        </div>
        <div id="library-grid" class="grid"></div>
      </section>

      <section class="view" id="view-detail" hidden>
        <div id="detail"></div>
      </section>

      <section class="view page" id="view-addons" hidden>
        <h2 class="page-title" data-say="ui.nav.addons"></h2>
        <p class="lede" data-say="ui.addons.note"></p>
        <form id="addon-form" class="inline-form">
          <input id="addon-input" type="url" autocomplete="off" spellcheck="false" />
          <button class="button play" type="submit" data-icon="plus" data-say="ui.action.install"></button>
        </form>
        <div id="addon-list" class="stack"></div>
      </section>

      <section class="view page" id="view-settings" hidden>
        <h2 class="page-title" data-say="ui.nav.settings"></h2>
        <div id="settings-form" class="settings"></div>
      </section>
    </main>

    <!-- What a viewer sees between pressing play and the first frame: a torrent
         can take a minute to find its swarm, and a catalogue that just sits
         there looks like nothing happened. -->
    <!-- Who is watching: every profile on this computer. -->
    <div id="who" class="who" hidden>
      <div class="who-inner">
        <h2 id="who-title" class="who-title"></h2>
        <div id="who-grid" class="who-grid"></div>
        <button id="who-manage" class="button ghost" type="button"></button>
      </div>
    </div>

    <!-- The first time the program opens. -->
    <div id="welcome" class="welcome" hidden>
      <div class="welcome-inner">
        <span class="mark big" aria-hidden="true"><span></span><span></span><span></span></span>
        <div id="welcome-body"></div>
      </div>
    </div>

    <div id="loading" class="loading" hidden>
      <div class="loading-art" id="loading-art"></div>
      <button id="loading-back" class="icon-button loading-back" type="button" data-icon="arrowLeft" data-label="ui.action.back"></button>
      <div class="loading-body">
        <div class="ring" aria-hidden="true"></div>
        <h2 id="loading-title"></h2>
        <p id="loading-stage" class="loading-stage" role="status"></p>
        <p id="loading-detail" class="muted"></p>
        <div class="meter"><i id="loading-meter"></i></div>
        <p id="loading-torrent" class="muted small"></p>
        <div class="loading-actions">
          <button id="loading-faster" class="button play" type="button" data-say="ui.player.faster" hidden></button>
          <button id="loading-cancel" class="button ghost" type="button" data-say="ui.player.abandon"></button>
        </div>
      </div>
    </div>

    <div id="link-dialog" class="dialog" hidden>
      <form id="link-form" class="dialog-card">
        <h3 data-say="ui.action.openlink"></h3>
        <input id="link-input" type="text" autocomplete="off" spellcheck="false" />
        <div class="dialog-actions">
          <button id="link-cancel" class="button ghost" type="button" data-say="ui.action.close"></button>
          <button class="button play" type="submit" data-icon="play" data-say="ui.action.play"></button>
        </div>
      </form>
    </div>

    <div id="menu" class="menu" role="menu" hidden></div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="icons.js"></script>
    <script src="app.js"></script>
    <script src="community.js"></script>
  </body>
</html>
