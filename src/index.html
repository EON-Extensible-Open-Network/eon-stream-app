The catalogue. Static HTML, CSS and JavaScript -- no framework, no bundler, no
Node. Everything a person reads here is empty in this file and filled from the
message catalogue at startup (madde 40): a `data-say` attribute names a key,
`data-label` names one for an aria-label, and a label with text baked into it
would be a label nobody can translate.

Every path in this file is relative, and nothing here assumes where it is
served from. That is deliberate: see "The interface is relocatable" in
docs/architecture.md.

The player is not in this page. It is `player.html`, a second webview laid
over mpv's picture while something plays; see src-tauri/src/surface.rs.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EON Stream</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="nav" id="nav">
      <button class="brand" type="button" data-go="home" data-label="ui.nav.home">
        <span class="mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="wordmark" aria-hidden="true">EON<b>Stream</b></span>
      </button>
      <nav class="links" data-label="ui.nav.menu">
        <button class="link" type="button" data-go="home" data-say="ui.nav.home"></button>
        <button class="link" type="button" data-go="series" data-say="ui.nav.series"></button>
        <button class="link" type="button" data-go="movie" data-say="ui.nav.movies"></button>
        <button class="link" type="button" data-go="library" data-say="ui.nav.library"></button>
        <button class="link" type="button" data-go="addons" data-say="ui.nav.addons"></button>
      </nav>
      <div class="nav-tools">
        <form id="search-form" class="searchbox" role="search">
          <button type="submit" class="icon-button" data-icon="search" data-label="ui.action.search"></button>
          <input id="search-input" type="search" autocomplete="off" spellcheck="false" />
        </form>
        <button id="link-open" class="icon-button" type="button" data-icon="link" data-label="ui.action.openlink"></button>
        <button class="icon-button" type="button" data-go="settings" data-icon="settings" data-label="ui.nav.settings"></button>
      </div>
    </header>

    <main id="main">
      <section class="view" id="view-home">
        <div id="hero" class="hero" hidden>
          <div class="hero-art" id="hero-art"></div>
          <div class="hero-shade"></div>
          <div class="hero-body">
            <h1 id="hero-title" class="hero-title"></h1>
            <div id="hero-facts" class="facts"></div>
            <p id="hero-text" class="hero-text"></p>
            <div class="hero-actions">
              <button id="hero-play" class="button play" type="button" data-icon="play" data-say="ui.hero.play"></button>
              <button id="hero-info" class="button ghost" type="button" data-icon="info" data-say="ui.hero.info"></button>
            </div>
          </div>
        </div>
        <div id="home-empty" class="empty" hidden>
          <span class="mark big" aria-hidden="true"><span></span><span></span><span></span></span>
          <h2 data-say="ui.empty.title"></h2>
          <p data-say="ui.empty.body"></p>
          <button id="empty-add" class="button play" type="button" data-icon="plus" data-say="ui.empty.action"></button>
        </div>
        <div id="rows" class="rows"></div>
      </section>

      <section class="view page" id="view-search" hidden>
        <h2 id="search-heading" class="page-title"></h2>
        <p id="search-correction" class="correction" hidden></p>
        <div id="search-grid" class="grid"></div>
      </section>

      <section class="view page" id="view-library" hidden>
        <h2 class="page-title" data-say="ui.nav.library"></h2>
        <div id="library-grid" class="grid"></div>
      </section>

      <section class="view" id="view-detail" hidden>
        <div id="detail"></div>
      </section>

      <section class="view page" id="view-addons" hidden>
        <h2 class="page-title" data-say="ui.nav.addons"></h2>
        <p class="lede" data-say="ui.addons.note"></p>
        <form id="addon-form" class="inline-form">
          <input id="addon-input" type="url" autocomplete="off" spellcheck="false" />
          <button class="button play" type="submit" data-icon="plus" data-say="ui.action.install"></button>
        </form>
        <div id="addon-list" class="stack"></div>
      </section>

      <section class="view page" id="view-settings" hidden>
        <h2 class="page-title" data-say="ui.nav.settings"></h2>
        <div id="settings-form" class="settings"></div>
      </section>
    </main>

    <!-- What a viewer sees between pressing play and the first frame: a torrent
         can take a minute to find its swarm, and a catalogue that just sits
         there looks like nothing happened. -->
    <div id="loading" class="loading" hidden>
      <div class="loading-art" id="loading-art"></div>
      <button id="loading-back" class="icon-button loading-back" type="button" data-icon="arrowLeft" data-label="ui.action.back"></button>
      <div class="loading-body">
        <div class="ring" aria-hidden="true"></div>
        <h2 id="loading-title"></h2>
        <p id="loading-stage" class="loading-stage" role="status"></p>
        <p id="loading-detail" class="muted"></p>
        <div class="meter"><i id="loading-meter"></i></div>
        <p id="loading-torrent" class="muted small"></p>
      </div>
    </div>

    <div id="link-dialog" class="dialog" hidden>
      <form id="link-form" class="dialog-card">
        <h3 data-say="ui.action.openlink"></h3>
        <input id="link-input" type="text" autocomplete="off" spellcheck="false" />
        <div class="dialog-actions">
          <button id="link-cancel" class="button ghost" type="button" data-say="ui.action.close"></button>
          <button class="button play" type="submit" data-icon="play" data-say="ui.action.play"></button>
        </div>
      </form>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="icons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
