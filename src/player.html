The player's controls. This page is a transparent webview laid over mpv's
picture while something plays (src-tauri/src/surface.rs), and exists only for
that long: there are no playback controls anywhere when nothing is playing.

The page draws no video and touches none. It reads the player's state from the
host and sends it one action at a time, the same `player` command the
headless build's prompt uses.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EON Stream</title>
    <link rel="stylesheet" href="player.css" />
  </head>
  <body class="awake">
    <div id="stage" class="stage"></div>

    <header class="top">
      <button id="back" class="control big" type="button" data-icon="arrowLeft" data-label="ui.player.back"></button>
    </header>

    <div id="center" class="center">
      <!-- While the picture waits on the network: what it is waiting for, and
           the way out. A start that never gets a frame used to leave nothing
           to press but a back button that the next poll undid. -->
      <div id="waiting" class="waiting" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p id="waiting-line" class="waiting-line" role="status"></p>
        <div class="waiting-actions">
          <button id="faster" class="abandon faster" type="button" data-say="ui.player.faster" hidden></button>
          <button id="abandon" class="abandon" type="button" data-say="ui.player.abandon"></button>
        </div>
      </div>
      <div id="flash" class="flash" aria-hidden="true"></div>
    </div>

    <p id="note" class="note" role="status" hidden></p>

    <footer class="bottom">
      <div class="timeline">
        <div id="scrub" class="scrub" role="slider" tabindex="0" aria-valuemin="0" data-label="ui.player.seek">
          <div class="rail">
            <div id="buffered" class="buffered"></div>
            <div id="played" class="played"></div>
          </div>
          <div id="thumb" class="thumb"></div>
          <div id="hover-time" class="hover-time" hidden></div>
        </div>
        <span id="remaining" class="remaining"></span>
      </div>

      <div class="bar">
        <div class="cluster">
          <button id="toggle" class="control big" type="button" data-icon="pause" data-label="ui.player.pause"></button>
          <button class="control" type="button" data-seek="-10" data-icon="back" data-number="10" data-label="ui.player.back10"></button>
          <button class="control" type="button" data-seek="10" data-icon="forward" data-number="10" data-label="ui.player.fwd10"></button>
          <button class="control" type="button" data-seek="-60" data-icon="back" data-number="60" data-label="ui.player.back60"></button>
          <button class="control" type="button" data-seek="60" data-icon="forward" data-number="60" data-label="ui.player.fwd60"></button>
          <div class="volume">
            <button id="mute" class="control" type="button" data-icon="volume" data-label="ui.player.mute"></button>
            <input id="volume" type="range" min="0" max="130" step="1" data-label="ui.player.volume" />
          </div>
          <span id="clock" class="clock"></span>
        </div>

        <div id="title" class="title"></div>

        <div class="cluster right">
          <button id="next" class="control" type="button" data-icon="next" data-label="ui.player.next" hidden></button>
          <button id="stop" class="control" type="button" data-icon="stop" data-label="ui.player.stop"></button>
          <button id="tracks-open" class="control" type="button" data-icon="subtitles" data-label="ui.player.tracks"></button>
          <button id="speed-open" class="control" type="button" data-icon="speed" data-label="ui.player.speed"></button>
          <button id="fullscreen" class="control" type="button" data-icon="fullscreen" data-label="ui.player.fullscreen"></button>
        </div>
      </div>
    </footer>

    <div id="tracks" class="panel tracks" hidden>
      <div class="column">
        <h3 data-say="ui.player.audio"></h3>
        <ul id="audio-list"></ul>
      </div>
      <div class="column">
        <h3 data-say="ui.player.subtitles"></h3>
        <ul id="sub-list"></ul>
        <h4 class="found-title" data-say="ui.subs.found"></h4>
        <p id="sub-note" class="sub-note" role="status"></p>
        <ul id="sub-found" class="sub-found"></ul>
        <button id="sub-file-open" class="sub-file" type="button" data-say="ui.subs.file"></button>
        <input id="sub-file" type="file" accept=".srt,.ass,.ssa,.vtt" hidden />
      </div>
      <div class="column">
        <h3 data-say="ui.player.adjust"></h3>
        <h4 class="found-title" data-say="ui.player.subsize"></h4>
        <div id="sizes" class="sizes" role="group"></div>
        <h4 class="found-title" data-say="ui.player.subsync"></h4>
        <div class="nudge">
          <button type="button" class="step" data-tune="sub-delay" data-by="-0.1">−0.1</button>
          <output id="sub-delay-value">0.0 s</output>
          <button type="button" class="step" data-tune="sub-delay" data-by="0.1">+0.1</button>
          <button type="button" class="zero" data-tune="sub-delay" data-by="0" data-say="ui.player.reset"></button>
        </div>
        <h4 class="found-title" data-say="ui.player.audiosync"></h4>
        <div class="nudge">
          <button type="button" class="step" data-tune="audio-delay" data-by="-0.1">−0.1</button>
          <output id="audio-delay-value">0.0 s</output>
          <button type="button" class="step" data-tune="audio-delay" data-by="0.1">+0.1</button>
          <button type="button" class="zero" data-tune="audio-delay" data-by="0" data-say="ui.player.reset"></button>
        </div>
      </div>
    </div>

    <!-- Every key the player answers to, on "?". -->
    <div id="keys" class="panel keys" hidden>
      <h3 data-say="ui.player.keys"></h3>
      <dl id="keys-list" class="keys-list"></dl>
    </div>

    <!-- The end of an episode: what comes next, and a count down to it that
         a press skips or stops. -->
    <aside id="upnext" class="upnext" hidden>
      <div class="upnext-label" data-say="ui.player.upnext"></div>
      <div id="upnext-title" class="upnext-title"></div>
      <div class="upnext-actions">
        <button id="upnext-play" class="upnext-play" type="button">
          <span id="upnext-fill" class="upnext-fill" aria-hidden="true"></span>
          <span id="upnext-text" class="upnext-text"></span>
        </button>
        <button id="upnext-dismiss" class="upnext-dismiss" type="button" data-say="ui.player.credits"></button>
      </div>
    </aside>

    <div id="speed" class="panel speed" hidden>
      <h3 data-say="ui.player.speed"></h3>
      <div id="speed-list" class="speed-list"></div>
    </div>

    <script src="icons.js"></script>
    <script src="player.js"></script>
  </body>
</html>
